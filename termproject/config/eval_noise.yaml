# 비교 B 평가 전용 '노이즈 시험 환경' — 두 정책(noDR / DR)을 같은 조건에서 비교한다.
# 학습 때 DR 범위보다 약간 넓게 잡아 실물 오차를 대신한다. (평가에서만 사용, 학습에 쓰지 않음)
randomization:
  enabled: true
  cube_friction_scale: [0.6, 1.4]
  cube_mass_scale: [0.8, 1.3]
  actuator_kp_scale: [0.7, 1.2]
  joint_vel_scale: [0.8, 1.1]
  obs_pos_bias_m: 0.004
  obs_pos_noise_m: 0.002
  obs_yaw_bias_rad: 0.06
  obs_yaw_noise_rad: 0.03
  obs_delay_steps: [1, 2]
  obs_dropout_prob: 0.08
  occlusion_radius_m: 0.02
